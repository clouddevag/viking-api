# nginx in front of PHP-FPM for the Laravel API.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    # PHP reads HTTPS as "on" for any value that is not empty and not "off", so
    # forwarding X-Forwarded-Proto straight through would make the literal
    # string "http" look like a secure connection. Only the exact value
    # "https" may set it.
    set $fcgi_https '';
    if ($http_x_forwarded_proto = 'https') {
        set $fcgi_https 'on';
    }

    # The API sits behind this; Laravel adds its own security headers per
    # response, so nginx only needs the ones it is better placed to set.
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # Compress JSON — menu and order payloads are the bulk of the traffic.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded media is served straight from disk, bypassing PHP entirely.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_hide_header X-Powered-By;

        # Long enough for a CSV export of a large date range.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Nothing else may reach the PHP interpreter.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
