; Production PHP settings for the Viking API.

memory_limit = 256M
max_execution_time = 60

; Menu photography is the largest thing uploaded; 8M matches
; config('viking.media.max_upload_kb').
upload_max_filesize = 8M
post_max_size = 12M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; OPcache. `validate_timestamps=0` is safe because the code is baked into the
; image — a deploy replaces the container rather than the files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit_buffer_size = 64M
opcache.jit = tracing

date.timezone = UTC
