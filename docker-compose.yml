# Viking Restaurant Platform — full stack.
#
#   docker compose up -d --build
#
# Brings up MySQL, Redis, the Laravel API behind nginx, the queue worker, the
# Reverb websocket server and the Next.js frontend. First boot runs migrations
# and seeders automatically.

name: viking

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-viking}
      MYSQL_USER: ${DB_USERNAME:-viking}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
      # utf8mb4 throughout — the menu is bilingual and Arabic needs 4 bytes.
      MYSQL_INITDB_SKIP_TZINFO: 1
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # InnoDB full-text needs a low minimum token length for short Arabic words.
      - --innodb-ft-min-token-size=2
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The API must not start migrating before MySQL is genuinely accepting
      # connections — a plain port check races the init scripts.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [viking]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [viking]

  # PHP-FPM. Owns migrations on first boot via its entrypoint.
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # Quoted: the default-message contains a colon, which YAML would
      # otherwise read as a nested mapping.
      APP_KEY: "${APP_KEY:?APP_KEY is required - generate one with 'php artisan key:generate --show'}"
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-viking}
      DB_USERNAME: ${DB_USERNAME:-viking}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-viking}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
      REVERB_HOST: ${REVERB_HOST:-localhost}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      # Set once on first boot; ignored afterwards.
      VIKING_SEED_PASSWORD: ${VIKING_SEED_PASSWORD:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    volumes:
      - api-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks: [viking]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - api-storage:/var/www/html/storage:ro
    networks: [viking]

  # Queue worker. Separate from the API so a slow job never blocks a request.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=1"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-viking}
      DB_USERNAME: ${DB_USERNAME:-viking}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-viking}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      # The worker must never re-run migrations.
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    volumes:
      - api-storage:/var/www/html/storage
    networks: [viking]

  # Websocket server — long-lived, so it cannot share the FPM container.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-viking}
      DB_USERNAME: ${DB_USERNAME:-viking}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-viking}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    volumes:
      - api-storage:/var/www/html/storage
    networks: [viking]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/next/Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so these are build args
        # rather than runtime environment.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_HOST:-localhost}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PUBLIC_PORT:-8080}
        NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_SCHEME:-http}
        NEXT_PUBLIC_MEDIA_HOSTNAME: ${NEXT_PUBLIC_MEDIA_HOSTNAME:-}
    restart: unless-stopped
    depends_on:
      nginx: { condition: service_started }
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    networks: [viking]

volumes:
  mysql-data:
  redis-data:
  api-storage:

networks:
  viking:
    driver: bridge
